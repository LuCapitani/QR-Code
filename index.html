<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
    <link rel="stylesheet" href="style.css">
    <title>Frontend Mentor | QR code component</title>
  </head>
  <body>
    <main class="main-container">
      <div class="card">
        <img src="assets/images/image-qr-code.png" alt="Código QR para acessar o site Frontend Mentor" class="qr-code-img">
        <h3 class="title">Improve your front-end skills by building projects</h3>
        <p class="paragraph">Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>
      </div>
      <footer class="credits">Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. Coded by Luis Felipe Capitani.</footer>
    </main>
  </body>
</html>
